<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body {
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-box {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px #ccc;
      width: 100%;
      max-width: 400px;
    }
    footer {
      width: 100%;
      text-align: center;
      background-color: #f4f4f4;
      padding: 10px 0;
      font-size: 14px;
      color: #333;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <main>
    <div class="login-box">
      <h4 class="mb-4 text-center">🔐 <strong>Login - Dashboard</strong></h4>
      <div class="form-group mb-3">
        <label>Usuário</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" id="username" class="form-control" placeholder="Digite seu usuário"/>
        </div>
      </div>
      <div class="form-group mb-3">
        <label>Senha</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" id="password" class="form-control" placeholder="Digite sua senha"/>
        </div>
      </div>
      <div id="msgErro" class="text-danger mb-2" style="display:none;"></div>
      <button class="btn btn-primary w-100 mb-3" onclick="fazerLogin()">🔑 Entrar</button>
      <div class="d-flex justify-content-between">
        <button class="btn btn-link p-0">Esqueceu a senha?</button>
        <button class="btn btn-link p-0">Lembrar dados</button>
      </div>
    </div>
  </main>

  <footer>
    <p>
      Desenvolvido por <a href="mailto:hugop.cordeiro@yahoo.com">Hugo Portelinha Cordeiro</a> | 
      <a href="#" data-bs-toggle="modal" data-bs-target="#modalChangelog">Versão 1.7</a>
    </p>
  </footer>

  <!-- Modal Changelog -->
  <div class="modal fade" id="modalChangelog" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">📜 Changelog</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <pre id="conteudoChangelog" class="p-3 bg-light border rounded" style="white-space: pre-wrap;"></pre>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = 'https://avaliation.onrender.com';

    async function fazerLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const msg = document.getElementById('msgErro');

      msg.style.display = 'none';

      if (!username || !password) {
        msg.textContent = "⚠️ Preencha todos os campos!";
        msg.style.display = 'block';
        return;
      }

      try {
        const resposta = await fetch(`${API}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (resposta.ok) {
          const dados = await resposta.json();
          localStorage.setItem('usuarioLogado', JSON.stringify(dados.user));
          window.location.href = 'dashboard.html';
        } else if (resposta.status === 401) {
          msg.textContent = "❌ Usuário ou senha inválidos!";
          msg.style.display = 'block';
        } else {
          msg.textContent = "⚠️ Servidor indisponível, tente novamente.";
          msg.style.display = 'block';
        }
      } catch (err) {
        console.error('Erro ao fazer login:', err);
        msg.textContent = "⚠️ Servidor indisponível, tente novamente.";
        msg.style.display = 'block';
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        fazerLogin();
      }
    });

    // 🔗 Carregar changelog ao abrir modal
    document.getElementById("modalChangelog").addEventListener("show.bs.modal", () => {
      fetch("CHANGELOG.md")
        .then(res => {
          if (!res.ok) throw new Error("Arquivo não encontrado");
          return res.text();
        })
        .then(txt => {
          document.getElementById("conteudoChangelog").textContent = txt;
        })
        .catch(() => {
          document.getElementById("conteudoChangelog").textContent = "⚠️ Não foi possível carregar o changelog.";
        });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
