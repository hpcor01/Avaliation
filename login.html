<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body {
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
    }
    .login-box {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px #ccc;
      width: 100%;
      max-width: 400px;
    }
    footer {
      width: 100%;
      text-align: center;
      background-color: #f4f4f4;
      padding: 10px 0;
      font-size: 14px;
      color: #333;
      border-top: 1px solid #ddd;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h4 class="mb-4 text-center">🔐 <strong>Login - Dashboard</strong></h4>
    <div class="form-group mb-3">
      <label>Usuário</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" id="username" class="form-control" placeholder="Digite seu usuário"/>
      </div>
    </div>
    <div class="form-group mb-3">
      <label>Senha</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" id="password" class="form-control" placeholder="Digite sua senha"/>
      </div>
    </div>
    <div id="msgErro" class="text-danger mb-2" style="display:none;"></div>
    <button class="btn btn-primary w-100 mb-3" onclick="fazerLogin()">🔑 Entrar</button>
    <div class="d-flex justify-content-between">
      <button class="btn btn-link p-0"><i class="bi bi-question"> Esqueceu a senha?</i></button>
      <button class="btn btn-link p-0">Lembrar dados</button>
    </div>
  </div>

  <footer>
    <p>Desenvolvido por <a href="mailto:hugop.cordeiro@yahoo.com">Hugo Portelinha Cordeiro</a> | Versão 1.7</p>
  </footer>

  <script>
    const API = 'https://avaliation.onrender.com';

    async function fazerLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const msg = document.getElementById('msgErro');

      msg.style.display = 'none';

      if (!username || !password) {
        msg.textContent = "⚠️ Preencha todos os campos!";
        msg.style.display = 'block';
        return;
      }

      try {
        const resposta = await fetch(`${API}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (resposta.ok) {
          const dados = await resposta.json();
          localStorage.setItem('usuarioLogado', JSON.stringify(dados.user));
          window.location.href = 'dashboard.html';
        } else if (resposta.status === 401) {
          msg.textContent = "❌ Usuário ou senha inválidos!";
          msg.style.display = 'block';
        } else {
          msg.textContent = "⚠️ Servidor indisponível, tente novamente.";
          msg.style.display = 'block';
        }
      } catch (err) {
        console.error('Erro ao fazer login:', err);
        msg.textContent = "⚠️ Servidor indisponível, tente novamente.";
        msg.style.display = 'block';
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        fazerLogin();
      }
    });
  </script>
</body>
</html>
