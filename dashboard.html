<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paine Administrativo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    .navbar-nav .nav-link { color: white !important; }
    #loadingMsg { display: none; font-weight: bold; text-align: center; margin: 20px 0; }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <span class="navbar-brand"><i class="bi bi-gear-fill"></i> Painel do Sistema</span>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="mostrarSessao('relatorio')"><i class="bi bi-file-earmark-bar-graph-fill"></i> Relatório</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="mostrarSessao('usuarios')"><i class="bi bi-person-fill"></i> Usuários</a>
          </li>
        </ul>
        <span class="navbar-text me-3 text-white" id="saudacao"><i class="bi bi-hand-index-thumb-fill"></i> Olá</span>
        <button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="bi bi-x-square-fill"></i> Sair</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div id="telaInicial" class="text-center">
      <h3>🙋🏻‍♂ Bem-vindo à sua dashboard!</h3>
      <p>▶️ Escolha uma das opções acima para começar.</p>
    </div>

    <div id="loadingMsg">⌛ Carregando dados...</div>

    <div id="secaoRelatorio" style="display:none">
      <ul class="nav nav-tabs">
        <li class="nav-item">
          <a class="nav-link active" data-bs-toggle="tab" href="#abaLista">📃 Relatório</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-bs-toggle="tab" href="#abaGrafico">📊 Gráfico</a>
        </li>
      </ul>
      <div class="tab-content mt-3">
        <div class="tab-pane fade show active" id="abaLista">
          <table class="table table-bordered mt-3">
            <thead><tr><th>👤 Nome</th><th>📝 Avaliação</th><th>🗓️ Data</th></tr></thead>
            <tbody id="tabelaAvaliacao"></tbody>
          </table>
        </div>
        <div class="tab-pane fade" id="abaGrafico">
          <canvas id="graficoAvaliacao" height="100"></canvas>
        </div>
      </div>
    </div>

    <div id="secaoUsuarios" style="display:none">
      <div class="d-flex justify-content-between mb-3">
        <h5>👤 Usuários ativos</h5>
        <button class="btn btn-sm btn-success" data-bs-toggle="modal" data-bs-target="#modalNovoUsuario">➕ Novo Usuário</button>
      </div>
      <table class="table table-bordered">
        <thead class="table-light">
          <tr><th>Nome</th><th>Usuário</th><th>Email</th><th>🪛 Ações</th></tr>
        </thead>
        <tbody id="listaUsuarios"></tbody>
      </table>
    </div>

  <!-- Modal Novo Usuário -->
  <div class="modal fade" id="modalNovoUsuario" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Cadastrar Usuário</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formNovoUsuario">
            <div class="mb-3">
              <label class="form-label">📝 Nome</label>
              <input type="text" class="form-control" id="nomeUsuario" required>
            </div>
            <div class="mb-3">
              <label class="form-label">👤 Usuário</label>
              <input type="text" class="form-control" id="usernameUsuario" required>
            </div>
            <div class="mb-3">
              <label class="form-label">📧 E-mail</label>
              <input type="email" class="form-control" id="emailUsuario" required>
            </div>
            <div class="mb-3">
              <label class="form-label">🔑 Senha</label>
              <input type="password" class="form-control" id="senhaUsuario" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" onclick="cadastrarUsuario()">Salvar</button>
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const API = 'https://avaliation.onrender.com';

    function mostrarSessao(sessao) {
      document.getElementById('telaInicial').style.display = 'none';
      document.getElementById('secaoRelatorio').style.display = sessao === 'relatorio' ? 'block' : 'none';
      document.getElementById('secaoUsuarios').style.display = sessao === 'usuarios' ? 'block' : 'none';
      document.getElementById('loadingMsg').style.display = 'block';

      if (sessao === 'relatorio') carregarRelatorio();
      if (sessao === 'usuarios') carregarUsuarios();
    }

    function logout() {
      localStorage.removeItem('usuarioLogado');
      window.location.href = 'login.html';
    }

    function carregarRelatorio() {
      fetch(`${API}/avaliacoes`).then(res => res.json()).then(data => {
        const tbody = document.getElementById('tabelaAvaliacao');
        tbody.innerHTML = '';
        const contagem = { 'Muito bom': 0, 'Bom': 0, 'Regular': 0, 'Ruim': 0 };

        data.forEach(item => {
          const row = `<tr><td>${item.nome}</td><td>${item.avaliacao}</td><td>${new Date(item.data).toLocaleString()}</td></tr>`;
          tbody.innerHTML += row;
          contagem[item.avaliacao]++;
        });

        atualizarGrafico(contagem);
        document.getElementById('loadingMsg').style.display = 'none';
      });
    }

    function atualizarGrafico(dados) {
      const ctx = document.getElementById('graficoAvaliacao');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: Object.keys(dados),
          datasets: [{
            label: 'Quantidade',
            data: Object.values(dados),
            backgroundColor: ['#28a745', '#8bc34a', '#ffc107', '#dc3545']
          }]
        }
      });
    }

    function carregarUsuarios() {
      fetch(`${API}/usuarios`).then(res => res.json()).then(data => {
        const lista = document.getElementById('listaUsuarios');
        lista.innerHTML = '';
        data.forEach(u => {
          const linha = `<tr><td>${u.nome}</td><td>${u.username}</td><td>${u.email}</td>
            <td><button class='btn btn-sm btn-primary'>Editar</button>
            <button class='btn btn-sm btn-danger'>Desativar</button></td></tr>`;
          lista.innerHTML += linha;
        });
        document.getElementById('loadingMsg').style.display = 'none';
      });
    }

    window.onload = () => {
      const usuario = JSON.parse(localStorage.getItem('usuarioLogado'));
      if (!usuario) return window.location.href = 'login.html';
      document.getElementById('saudacao').innerText = `👋 Olá, ${usuario.nome}`;
      // usuário vem direto de user do backend

      let logoutTimer;
      function resetInactivityTimer() {
        clearTimeout(logoutTimer);
        logoutTimer = setTimeout(() => {
          alert('Sessão expirada por inatividade.');
          logout();
        }, 15 * 60 * 1000);
      }

      ['mousemove', 'keypress', 'click'].forEach(evt =>
        document.addEventListener(evt, resetInactivityTimer)
      );

      resetInactivityTimer();

      window.addEventListener("beforeunload", () => {
        localStorage.removeItem('usuarioLogado');
      });
    }

    async function cadastrarUsuario() {
      const novo = {
        username: document.getElementById('novoUsername').value,
        password: document.getElementById('novoPassword').value,
        nome: document.getElementById('novoNome').value,
        email: document.getElementById('novoEmail').value
      };
    
      const res = await fetch(`${API}/usuarios`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(novo)
      });
    
      if (res.ok) {
        alert("✅ Usuário cadastrado com sucesso!");
        carregarUsuarios();
      } else {
        const erro = await res.text();
        alert("Erro: " + erro);
      }
    }

    function carregarUsuarios() {
      fetch(`${API}/usuarios`).then(res => res.json()).then(data => {
        const lista = document.getElementById('listaUsuarios');
        lista.innerHTML = '';
        data.forEach(u => {
          const linha = `<tr>
              <td>${u.nome}</td>
              <td>${u.username}</td>
              <td>${u.email}</td>
              <td>
                <button class='btn btn-sm btn-primary'>✏️ Editar</button>
                <button class='btn btn-sm btn-danger'>​⛔​ Desativar</button>
              </td>
            </tr>`;
          lista.innerHTML += linha;
        });
        document.getElementById('loadingMsg').style.display = 'none';
      });
}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
