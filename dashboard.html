<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Painel Administrativo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
  <style>
    .navbar-nav .nav-link { color: white !important; }
    #loadingMsg { display:none; font-weight: bold; text-align:center; margin: 20px 0; }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <span class="navbar-brand"><i class="bi bi-gear-fill"></i> Painel do Sistema</span>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="mostrarSessao('relatorio')"><i class="bi bi-file-earmark-bar-graph-fill"></i> Relatório</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="mostrarSessao('usuarios')"><i class="bi bi-person-fill"></i> Usuários</a>
          </li>
        </ul>
        <span class="navbar-text me-3 text-white" id="saudacao">Olá</span>
        <button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div id="telaInicial" class="text-center">
      <h3>🙋🏻‍♂ Bem-vindo à sua dashboard!</h3>
      <p>▶️ Escolha uma das opções acima para começar.</p>
    </div>

    <div id="loadingMsg">⌛ Carregando dados...</div>

    <!-- ================= RELATÓRIO ================= -->
    <div id="secaoRelatorio" style="display:none">
      <div class="row mb-3">
        <div class="col-md-3">
          <label>Data início:</label>
          <input type="date" id="dataInicio" class="form-control">
        </div>
        <div class="col-md-3">
          <label>Data fim:</label>
          <input type="date" id="dataFim" class="form-control">
        </div>
        <div class="col-md-3">
          <label>Tipo de Avaliação:</label>
          <select id="tipoAvaliacao" class="form-control">
            <option value="">Todos</option>
            <option value="Muito bom">Muito bom</option>
            <option value="Bom">Bom</option>
            <option value="Regular">Regular</option>
            <option value="Ruim">Ruim</option>
          </select>
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button class="btn btn-primary me-2" onclick="filtrarDados()"><i class="bi bi-funnel-fill"></i> Filtrar</button>
          <button class="btn btn-secondary me-2" onclick="limparFiltros()"><i class="bi bi-funnel"></i> Limpar</button>
        </div>
      </div>

      <ul class="nav nav-tabs">
        <li class="nav-item">
          <a class="nav-link active" data-bs-toggle="tab" href="#abaLista">📃 Relatório</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-bs-toggle="tab" href="#abaGrafico">📊 Gráfico</a>
        </li>
      </ul>

      <div class="tab-content mt-3">
        <!-- LISTA -->
        <div class="tab-pane fade show active" id="abaLista">
          <div class="d-flex justify-content-end mb-2">
            <button class="btn btn-success btn-sm me-2" onclick="exportarParaExcel()"><i class="bi bi-file-earmark-excel-fill"></i> Excel</button>
            <button class="btn btn-danger btn-sm" onclick="exportarRelatorioPDF()"><i class="bi bi-file-earmark-pdf-fill"></i> PDF</button>
          </div>
          <table class="table table-bordered">
            <thead><tr><th>👤 Nome</th><th>📝 Avaliação</th><th>🗓️ Data</th></tr></thead>
            <tbody id="tabelaAvaliacao"></tbody>
          </table>
        </div>
        <!-- GRÁFICO -->
        <div class="tab-pane fade" id="abaGrafico">
          <canvas id="graficoAvaliacao" height="100"></canvas>
          <div class="d-flex justify-content-end mt-2">
            <button class="btn btn-danger btn-sm" onclick="exportarGraficoPDF()"><i class="bi bi-file-earmark-pdf-fill"></i> PDF</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= USUÁRIOS ================= -->
    <div id="secaoUsuarios" style="display:none">
      <h5>👤 Usuários ativos</h5>
      <table class="table table-bordered">
        <thead><tr><th>Nome</th><th>Usuário</th><th>Email</th><th>Ações</th></tr></thead>
        <tbody id="listaUsuarios"></tbody>
      </table>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script>
    const API = 'https://avaliation.onrender.com';
    let dadosOriginais = [];
    let chart;

    function mostrarSessao(sessao) {
      document.getElementById('telaInicial').style.display = 'none';
      document.getElementById('secaoRelatorio').style.display = sessao === 'relatorio' ? 'block' : 'none';
      document.getElementById('secaoUsuarios').style.display = sessao === 'usuarios' ? 'block' : 'none';
      document.getElementById('loadingMsg').style.display = 'block';

      if (sessao === 'relatorio') carregarAvaliacoes();
      if (sessao === 'usuarios') carregarUsuarios();
    }

    function logout() {
      localStorage.removeItem('usuarioLogado');
      window.location.href = 'login.html';
    }

    async function carregarAvaliacoes() {
      const res = await fetch(`${API}/avaliacoes`);
      const data = await res.json();
      dadosOriginais = data;
      carregarTabela(data);
      atualizarGrafico(data);
      document.getElementById('loadingMsg').style.display = 'none';
    }

    function carregarTabela(lista) {
      const corpo = document.getElementById('tabelaAvaliacao');
      corpo.innerHTML = '';
      lista.forEach(item => {
        corpo.innerHTML += `<tr><td>${item.nome || '-'}</td><td>${item.avaliacao}</td><td>${new Date(item.data).toLocaleDateString()}</td></tr>`;
      });
    }

    function filtrarDados() {
      const inicio = document.getElementById('dataInicio').value;
      const fim = document.getElementById('dataFim').value;
      const tipo = document.getElementById('tipoAvaliacao').value;

      const inicioDate = inicio ? new Date(inicio + 'T00:00:00') : null;
      const fimDate = fim ? new Date(fim + 'T23:59:59') : null;

      const filtrados = dadosOriginais.filter(item => {
        const data = new Date(item.data);
        const condData = (!inicioDate || data >= inicioDate) && (!fimDate || data <= fimDate);
        const condTipo = !tipo || item.avaliacao === tipo;
        return condData && condTipo;
      });

      carregarTabela(filtrados);
      atualizarGrafico(filtrados);
    }

    function limparFiltros() {
      document.getElementById('dataInicio').value = '';
      document.getElementById('dataFim').value = '';
      document.getElementById('tipoAvaliacao').value = '';
      carregarTabela(dadosOriginais);
      atualizarGrafico(dadosOriginais);
    }

    function atualizarGrafico(dados) {
      const contagem = { 'Muito bom': 0, 'Bom': 0, 'Regular': 0, 'Ruim': 0 };
      dados.forEach(d => contagem[d.avaliacao]++);
      const ctx = document.getElementById('graficoAvaliacao').getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: Object.keys(contagem),
          datasets: [{
            label: 'Quantidade',
            data: Object.values(contagem),
            backgroundColor: ['#28a745','#8bc34a','#ffc107','#dc3545']
          }]
        },
        options: { plugins: { legend: { display: false } } }
      });
    }

    function exportarParaExcel() {
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.table_to_sheet(document.querySelector("table"));
      XLSX.utils.book_append_sheet(wb, ws, "Avaliações");
      XLSX.writeFile(wb, "relatorio-avaliacoes.xlsx");
    }

    async function exportarRelatorioPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.text("📊 Relatório de Avaliações", 14, 20);
      doc.setFontSize(11);
      doc.text(`Emitido em: ${new Date().toLocaleString("pt-BR")}`, 14, 28);

      const head = [["Nome", "Avaliação", "Data"]];
      const body = [];
      document.querySelectorAll("#tabelaAvaliacao tr").forEach(tr => {
        const cols = tr.querySelectorAll("td");
        if (cols.length) body.push([cols[0].innerText, cols[1].innerText, cols[2].innerText]);
      });

      doc.autoTable({ startY: 35, head, body, theme: "grid" });
      doc.text(`Total de registros: ${body.length}`, 14, doc.lastAutoTable.finalY + 10);
      doc.save("relatorio-avaliacoes.pdf");
    }

    async function exportarGraficoPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(16);
      doc.text("📊 Gráfico de Avaliações", 14, 20);
      doc.text(`Emitido em: ${new Date().toLocaleString("pt-BR")}`, 14, 28);
      const canvas = document.getElementById("graficoAvaliacao");
      const img = canvas.toDataURL("image/png", 1.0);
      doc.addImage(img, "PNG", 15, 40, 180, 100);
      doc.save("grafico-avaliacoes.pdf");
    }

    async function carregarUsuarios() {
      const res = await fetch(`${API}/usuarios`);
      const data = await res.json();
      const lista = document.getElementById('listaUsuarios');
      lista.innerHTML = '';
      data.forEach(u => {
        lista.innerHTML += `<tr><td>${u.nome}</td><td>${u.username}</td><td>${u.email}</td>
          <td><button class='btn btn-sm btn-primary'>Editar</button>
          <button class='btn btn-sm btn-danger'>Desativar</button></td></tr>`;
      });
      document.getElementById('loadingMsg').style.display = 'none';
    }

    // Proteção da sessão
    window.onload = () => {
      const usuario = JSON.parse(localStorage.getItem('usuarioLogado'));
      if (!usuario) return window.location.href = 'login.html';
      document.getElementById('saudacao').innerText = `👋 Olá, ${usuario.nome}`;

      // Expira após 15 minutos
      let logoutTimer;
      function resetInactivityTimer() {
        clearTimeout(logoutTimer);
        logoutTimer = setTimeout(() => { alert('Sessão expirada.'); logout(); }, 15*60*1000);
      }
      ["mousemove","keypress","click"].forEach(evt => document.addEventListener(evt, resetInactivityTimer));
      resetInactivityTimer();
      window.addEventListener("beforeunload", () => localStorage.removeItem('usuarioLogado'));
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
