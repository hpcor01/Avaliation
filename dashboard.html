<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <style>
    .navbar-nav .nav-link { color: white !important; }
    #loadingMsg { display: none; font-weight: bold; text-align: center; margin: 20px 0; }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      text-align: center;
      background-color: #f2f2f2; /* cor de fundo opcional */
      padding: 10px 0;
      font-size: 14px;
      color: #333;
  }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <span class="navbar-brand"><i class="bi bi-gear-fill"></i> <a title="Dashboard" href="#"> Painel do Sistema</a></span>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="mostrarSessao('relatorio')"><i class="bi bi-file-earmark-bar-graph-fill"></i> Relatório</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="mostrarSessao('usuarios')"><i class="bi bi-person-fill"></i> Usuários</a>
          </li>
        </ul>
        <span class="navbar-text me-3 text-white" id="saudacao"><i class="bi bi-hand-index-thumb-fill"></i> Olá</span>
        <button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="bi bi-x-square-fill"></i> Sair</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div id="telaInicial" class="text-center">
      <h3>🙋🏻‍♂ Bem-vindo à sua dashboard!</h3>
      <p>▶️ Escolha uma das opções acima para começar.</p>
    </div>

    <div id="loadingMsg">⌛ Carregando dados...</div>

    <div id="secaoRelatorio" style="display:none">
      <ul class="nav nav-tabs">
        <li class="nav-item">
          <a class="nav-link active" data-bs-toggle="tab" href="#abaLista">📃 Relatório</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-bs-toggle="tab" href="#abaGrafico">📊 Gráfico</a>
        </li>
      </ul>

      <!-- Filtro e exportação -->
      <div class="d-flex justify-content-between my-3 flex-wrap">
        <div class="d-flex align-items-center gap-2">
          <input type="date" class="form-control form-control-sm" id="dataInicio">
          <input type="date" class="form-control form-control-sm" id="dataFim">
          <button class="btn btn-sm btn-primary" onclick="aplicarFiltro()">
            <i class="bi bi-funnel-fill"></i> Filtrar
          </button>
          <button class="btn btn-sm btn-secondary" onclick="limparFiltro()">
            <i class="bi bi-funnel"></i> Limpar
          </button>
        </div>
        <div>
          <button class="btn btn-sm btn-success me-2" onclick="exportarExcel()">
            <i class="bi bi-file-earmark-excel-fill"></i> Excel
          </button>
          <button class="btn btn-sm btn-danger" onclick="exportarPDF()">
            <i class="bi bi-file-earmark-pdf-fill"></i> PDF
          </button>
        </div>
      </div>

      <div class="tab-content mt-3">
        <div class="tab-pane fade show active" id="abaLista">
          <table class="table table-bordered mt-3">
            <thead><tr><th>👤 Nome</th><th>📝 Avaliação</th><th>🗓️ Data</th></tr></thead>
            <tbody id="tabelaAvaliacao"></tbody>
          </table>
        </div>
        <div class="tab-pane fade" id="abaGrafico">
          <canvas id="graficoAvaliacao" height="100"></canvas>
        </div>
      </div>
    </div>

    <div id="secaoUsuarios" style="display:none">
      <div class="d-flex justify-content-between mb-3">
        <h5>👤 Usuários ativos</h5>
        <button class="btn btn-sm btn-success" data-bs-toggle="modal" data-bs-target="#modalNovoUsuario">
            <i class="bi bi-person-plus-fill"> Novo Usuário</i>
        </button>
      </div>
      <table class="table table-bordered">
        <thead class="table-light">
          <tr><th>📝 Nome</th><th>👤Usuário</th><th>📧Email</th><th>🪛 Ações</th></tr>
        </thead>
        <tbody id="listaUsuarios"></tbody>
      </table>
    </div>
  </div>

  <footer class="footer" id="footer">
    <p>Desenvolvido por <a href="mailto:hugop.cordeiro@yahoo.com">Hugo Portelinha Cordeiro </a> | © <script>document.write(new Date().getFullYear());</script></p>
  </footer>

  <script>
    const API = 'https://avaliation.onrender.com';
    let dadosOriginais = [];
    let dadosFiltrados = [];
    let grafico = null;

    function mostrarSessao(sessao) {
      document.getElementById('telaInicial').style.display = 'none';
      document.getElementById('secaoRelatorio').style.display = sessao === 'relatorio' ? 'block' : 'none';
      document.getElementById('secaoUsuarios').style.display = sessao === 'usuarios' ? 'block' : 'none';
      document.getElementById('loadingMsg').style.display = 'block';

      if (sessao === 'relatorio') carregarRelatorio();
      if (sessao === 'usuarios') carregarUsuarios();
    }

    function logout() {
      localStorage.removeItem('usuarioLogado');
      window.location.href = 'login.html';
    }

    function carregarRelatorio() {
      fetch(`${API}/avaliacoes`).then(res => res.json()).then(data => {
        dadosOriginais = data;
        dadosFiltrados = [...dadosOriginais];
        renderTabela(dadosFiltrados);
        atualizarGrafico(dadosFiltrados);
        document.getElementById('loadingMsg').style.display = 'none';
      });
    }

    function renderTabela(dados) {
      const tbody = document.getElementById('tabelaAvaliacao');
      tbody.innerHTML = '';
      dados.forEach(item => {
        const row = `<tr><td>${item.nome}</td><td>${item.avaliacao}</td><td>${new Date(item.data).toLocaleString()}</td></tr>`;
        tbody.innerHTML += row;
      });
    }

    function atualizarGrafico(dados) {
      const contagem = { 'Muito bom': 0, 'Bom': 0, 'Regular': 0, 'Ruim': 0 };
      dados.forEach(item => contagem[item.avaliacao]++);
      const ctx = document.getElementById('graficoAvaliacao');

      if (grafico) grafico.destroy();

      grafico = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: Object.keys(contagem),
          datasets: [{
            label: 'Quantidade',
            data: Object.values(contagem),
            backgroundColor: ['#28a745', '#8bc34a', '#ffc107', '#dc3545']
          }]
        }
      });
    }

    // Filtros
    function aplicarFiltro() {
      const inicio = document.getElementById("dataInicio").value;
      const fim = document.getElementById("dataFim").value;

      if (!inicio || !fim) {
        alert("Selecione data inicial e final.");
        return;
      }

      const dataInicio = new Date(inicio);
      const dataFim = new Date(fim);
      dataFim.setHours(23,59,59,999); // incluir o dia final inteiro

      dadosFiltrados = dadosOriginais.filter(d => {
        const dt = new Date(d.data);
        return dt >= dataInicio && dt <= dataFim;
      });

      renderTabela(dadosFiltrados);
      atualizarGrafico(dadosFiltrados);
    }

    function limparFiltro() {
      document.getElementById("dataInicio").value = "";
      document.getElementById("dataFim").value = "";
      dadosFiltrados = [...dadosOriginais];
      renderTabela(dadosFiltrados);
      atualizarGrafico(dadosFiltrados);
    }

    // Exportações
    function exportarExcel() {
      const abaAtiva = document.querySelector(".nav-link.active").getAttribute("href");
      if (abaAtiva === "#abaLista") {
        const ws = XLSX.utils.json_to_sheet(dadosFiltrados.map(d => ({
          Nome: d.nome,
          Avaliação: d.avaliacao,
          Data: new Date(d.data).toLocaleString()
        })));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Relatório");
        XLSX.writeFile(wb, "relatorio.xlsx");
      } else {
        const chart = document.getElementById("graficoAvaliacao");
        const base64Image = chart.toDataURL("image/png");
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet([["Gráfico de Avaliações"], [base64Image]]);
        XLSX.utils.book_append_sheet(wb, ws, "Gráfico");
        XLSX.writeFile(wb, "grafico.xlsx");
      }
    }

    function exportarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const abaAtiva = document.querySelector(".nav-link.active").getAttribute("href");
      if (abaAtiva === "#abaLista") {
        doc.text("Relatório de Avaliações", 14, 15);
        doc.autoTable({
          head: [["Nome", "Avaliação", "Data"]],
          body: dadosFiltrados.map(d => [
            d.nome,
            d.avaliacao,
            new Date(d.data).toLocaleString()
          ]),
          startY: 25
        });
        doc.save("relatorio.pdf");
      } else {
        const chart = document.getElementById("graficoAvaliacao");
        const imgData = chart.toDataURL("image/png", 1.0);
        doc.text("Gráfico de Avaliações", 14, 15);
        doc.addImage(imgData, "PNG", 15, 30, 180, 100);
        doc.save("grafico.pdf");
      }
    }

    function carregarUsuarios() {
      fetch(`${API}/usuarios`).then(res => res.json()).then(data => {
        const lista = document.getElementById('listaUsuarios');
        lista.innerHTML = '';
        data.forEach(u => {
          const linha = `<tr><td>${u.nome}</td><td>${u.username}</td><td>${u.email}</td>
            <td>
                <button class='btn btn-sm btn-primary'>
                    <i class="bi bi-pencil-square"> Editar</i>
                </button>
                <button class='btn btn-sm btn-danger'>
                    <i class="bi bi-person-x-fill"> Desativar</i>
                </button>
            </td></tr>`;
          lista.innerHTML += linha;
        });
        document.getElementById('loadingMsg').style.display = 'none';
      });
    }

    window.onload = () => {
      window.onload = () => {
    const usuario = JSON.parse(localStorage.getItem('usuarioLogado'));

    // Protege a sessão
    if (!usuario || !usuario.nome) {
      window.location.href = 'login.html';
      return;
    }

    // Saudação personalizada
    document.getElementById('saudacao').innerText = `👋 Olá, ${usuario.nome}`;

    // 🔒 Logout automático por inatividade (15 min)
    let logoutTimer;
    function resetInactivityTimer() {
      clearTimeout(logoutTimer);
      logoutTimer = setTimeout(() => {
        alert("Sessão expirada por inatividade.");
        logout();
      }, 15 * 60 * 1000); // 15 minutos
    }

    ['mousemove', 'keypress', 'click'].forEach(evt =>
      document.addEventListener(evt, resetInactivityTimer)
    );
    resetInactivityTimer();

    // 🔒 Logout ao fechar aba ou navegador
    window.addEventListener("beforeunload", () => {
      localStorage.removeItem("usuarioLogado");
    });
  };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
