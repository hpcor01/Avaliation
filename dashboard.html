<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    .navbar-nav .nav-link { color: white !important; }
    #loadingMsg { display: none; font-weight: bold; text-align: center; margin: 20px 0; }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <span class="navbar-brand"><i class="bi bi-gear-fill"></i> Painel do Sistema</span>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="mostrarSessao('relatorio')"><i class="bi bi-file-earmark-bar-graph-fill"></i> Relatório</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="mostrarSessao('usuarios')"><i class="bi bi-people-fill"></i> Usuários</a>
          </li>
        </ul>
        <span class="navbar-text me-3 text-white" id="saudacao"><i class="bi bi-hand-thumbs-up-fill"></i> Olá</span>
        <button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div id="telaInicial" class="text-center">
      <h3>🙋🏻‍♂ Bem-vindo à sua dashboard!</h3>
      <p>▶️ Escolha uma das opções acima para começar.</p>
    </div>

    <div id="loadingMsg">⌛ Carregando dados...</div>

    <!-- RELATÓRIO -->
    <div id="secaoRelatorio" style="display:none">
      <ul class="nav nav-tabs">
        <li class="nav-item">
          <a class="nav-link active" data-bs-toggle="tab" href="#abaLista">📃 Relatório</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-bs-toggle="tab" href="#abaGrafico">📊 Gráfico</a>
        </li>
      </ul>
      <div class="tab-content mt-3">
        <div class="tab-pane fade show active" id="abaLista">
          <div class="row mb-3">
            <div class="col-md-3">
              <label>Data início:</label>
              <input type="date" id="dataInicio" class="form-control">
            </div>
            <div class="col-md-3">
              <label>Data fim:</label>
              <input type="date" id="dataFim" class="form-control">
            </div>
            <div class="col-md-3">
              <label>Tipo de Avaliação:</label>
              <select id="tipoAvaliacao" class="form-control">
                <option value="">Todos</option>
                <option value="Muito bom">Muito bom</option>
                <option value="Bom">Bom</option>
                <option value="Regular">Regular</option>
                <option value="Ruim">Ruim</option>
              </select>
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <button class="btn btn-primary me-2" onclick="filtrarDados()">
                <i class="bi bi-funnel-fill"></i> Filtrar
              </button>
              <button class="btn btn-secondary me-2" onclick="limparFiltros()">
                <i class="bi bi-funnel"></i> Limpar
              </button>
              <button class="btn btn-success me-2" onclick="exportarExcel()">
                <i class="bi bi-file-earmark-excel-fill"></i> Excel
              </button>
              <button class="btn btn-danger" onclick="exportarPDF()">
                <i class="bi bi-file-earmark-pdf-fill"></i> PDF
              </button>
            </div>
          </div>

          <table class="table table-bordered mt-3">
            <thead><tr><th>👤 Nome</th><th>📝 Avaliação</th><th>🗓️ Data</th></tr></thead>
            <tbody id="tabelaAvaliacao"></tbody>
          </table>
        </div>
        <div class="tab-pane fade" id="abaGrafico">
          <canvas id="graficoAvaliacao" height="100"></canvas>
          <div class="mt-3">
            <button class="btn btn-success me-2" onclick="exportarGraficoExcel()">
              <i class="bi bi-file-earmark-excel-fill"></i> Exportar Excel
            </button>
            <button class="btn btn-danger" onclick="exportarGraficoPDF()">
              <i class="bi bi-file-earmark-pdf-fill"></i> Exportar PDF
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- USUÁRIOS -->
    <div id="secaoUsuarios" style="display:none">
      <div class="d-flex justify-content-between mb-3">
        <h5>👤 Usuários ativos</h5>
        <button class="btn btn-sm btn-success" data-bs-toggle="modal" data-bs-target="#modalNovoUsuario">➕ Novo Usuário</button>
      </div>
      <table class="table table-bordered">
        <thead class="table-light">
          <tr><th>Nome</th><th>Usuário</th><th>Email</th><th>🪛 Ações</th></tr>
        </thead>
        <tbody id="listaUsuarios"></tbody>
      </table>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <script>
    const API = 'https://avaliation.onrender.com';
    let dadosOriginais = [];
    let dadosFiltrados = [];
    let grafico = null;

    function mostrarSessao(sessao) {
      document.getElementById('telaInicial').style.display = 'none';
      document.getElementById('secaoRelatorio').style.display = sessao === 'relatorio' ? 'block' : 'none';
      document.getElementById('secaoUsuarios').style.display = sessao === 'usuarios' ? 'block' : 'none';
      document.getElementById('loadingMsg').style.display = 'block';

      if (sessao === 'relatorio') carregarRelatorio();
      if (sessao === 'usuarios') carregarUsuarios();
    }

    function logout() {
      localStorage.removeItem('usuarioLogado');
      window.location.href = 'login.html';
    }

    function carregarRelatorio() {
      fetch(`${API}/avaliacoes`).then(res => res.json()).then(data => {
        dadosOriginais = data;
        dadosFiltrados = [...dadosOriginais];
        renderTabela(dadosFiltrados);
        atualizarGrafico(dadosFiltrados);
        document.getElementById('loadingMsg').style.display = 'none';
      });
    }

    function renderTabela(lista) {
      const tbody = document.getElementById('tabelaAvaliacao');
      tbody.innerHTML = '';
      lista.forEach(item => {
        const row = `<tr><td>${item.nome}</td><td>${item.avaliacao}</td><td>${new Date(item.data).toLocaleString()}</td></tr>`;
        tbody.innerHTML += row;
      });
    }

    function filtrarDados() {
      const inicio = document.getElementById('dataInicio').value;
      const fim = document.getElementById('dataFim').value;
      const tipo = document.getElementById('tipoAvaliacao').value;

      dadosFiltrados = dadosOriginais.filter(item => {
        const dataItem = new Date(item.data);
        const dentroData = (!inicio || dataItem >= new Date(inicio)) &&
                           (!fim || dataItem <= new Date(fim + "T23:59:59"));
        const mesmoTipo = !tipo || item.avaliacao === tipo;
        return dentroData && mesmoTipo;
      });

      renderTabela(dadosFiltrados);
      atualizarGrafico(dadosFiltrados);
    }

    function limparFiltros() {
      document.getElementById('dataInicio').value = '';
      document.getElementById('dataFim').value = '';
      document.getElementById('tipoAvaliacao').value = '';
      dadosFiltrados = [...dadosOriginais];
      renderTabela(dadosFiltrados);
      atualizarGrafico(dadosFiltrados);
    }

    function atualizarGrafico(dados) {
      const contagem = { 'Muito bom': 0, 'Bom': 0, 'Regular': 0, 'Ruim': 0 };
      dados.forEach(d => contagem[d.avaliacao]++);
      const ctx = document.getElementById('graficoAvaliacao').getContext('2d');
      if (grafico) grafico.destroy();
      grafico = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: Object.keys(contagem),
          datasets: [{ label: 'Quantidade', data: Object.values(contagem), backgroundColor: ['#28a745', '#8bc34a', '#ffc107', '#dc3545'] }]
        }
      });
    }

    function exportarExcel() {
      const ws = XLSX.utils.json_to_sheet(dadosFiltrados);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Relatório");
      XLSX.writeFile(wb, "relatorio.xlsx");
    }

    async function exportarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text("Relatório de Avaliações", 14, 20);
      let y = 30;
      dadosFiltrados.forEach(item => {
        doc.text(`${item.nome} - ${item.avaliacao} - ${new Date(item.data).toLocaleDateString()}`, 14, y);
        y += 10;
      });
      doc.save("relatorio.pdf");
    }

    async function exportarGraficoPDF() {
      const canvas = document.getElementById("graficoAvaliacao");
      const imgData = canvas.toDataURL("image/png");
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();
      pdf.addImage(imgData, "PNG", 10, 10, 190, 100);
      pdf.save("grafico.pdf");
    }

    function exportarGraficoExcel() {
      const contagem = { 'Muito bom': 0, 'Bom': 0, 'Regular': 0, 'Ruim': 0 };
      dadosFiltrados.forEach(d => contagem[d.avaliacao]++);
      const ws = XLSX.utils.json_to_sheet(Object.entries(contagem).map(([k,v]) => ({ Avaliação: k, Quantidade: v })));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Gráfico");
      XLSX.writeFile(wb, "grafico.xlsx");
    }

    function carregarUsuarios() {
      fetch(`${API}/usuarios`).then(res => res.json()).then(data => {
        const lista = document.getElementById('listaUsuarios');
        lista.innerHTML = '';
        data.forEach(u => {
          const linha = `<tr><td>${u.nome}</td><td>${u.username}</td><td>${u.email}</td>
            <td><button class='btn btn-sm btn-primary'><i class="bi bi-pencil-square"></i> Editar</button>
            <button class='btn btn-sm btn-danger'><i class="bi bi-person-x-fill"></i> Desativar</button></td></tr>`;
          lista.innerHTML += linha;
        });
        document.getElementById('loadingMsg').style.display = 'none';
      });
    }

    // 🔒 Sessão protegida e expira
    window.onload = () => {
      const usuario = JSON.parse(localStorage.getItem('usuarioLogado'));
      if (!usuario || !usuario.nome) {
        window.location.href = 'login.html';
        return;
      }
      document.getElementById('saudacao').innerHTML = `<i class="bi bi-hand-thumbs-up-fill"></i> Olá, ${usuario.nome}`;

      let logoutTimer;
      function resetInactivityTimer() {
        clearTimeout(logoutTimer);
        logoutTimer = setTimeout(() => {
          alert("Sessão expirada por inatividade.");
          logout();
        }, 15 * 60 * 1000);
      }
      ['mousemove', 'keypress', 'click'].forEach(evt =>
        document.addEventListener(evt, resetInactivityTimer)
      );
      resetInactivityTimer();

      window.addEventListener("beforeunload", () => {
        localStorage.removeItem("usuarioLogado");
      });
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
